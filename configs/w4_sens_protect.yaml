# §6.3: W4 WO on all Linear units except sensitivity-protected ones.
# Protect: geometry heads + units with desk ΔATE >5% under leave-one W4 (dec_blocks2.8).
name: w4_sens_protect
system: mast3r-slam
precision:
  trunk: int4_wo_except_protect
  heads: fp16
  protect: [dec_blocks2.8, downstream_head1, downstream_head2]
quant:
  method: fake_except
  weight_bits: 4
  act_bits: 16
  protect_threshold_desk: 0.05
eval:
  datasets: [tum_fr1_desk, tum_fr1_all]
  runs: 1
  seed: 0
device: rig
